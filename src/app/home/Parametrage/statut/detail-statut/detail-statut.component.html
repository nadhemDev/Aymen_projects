<div class="modal-header">
    <h4 class="modal-title">Détail du Statut</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  
  <div class="modal-body">
    <p><strong>ID Statut:</strong> {{ statut?.id_statut }}</p>
    <p><strong>Libellé:</strong> {{ statut?.libelle }}</p>
    <p><strong>Module:</strong> {{ statut?.module }}</p>
  </div>
