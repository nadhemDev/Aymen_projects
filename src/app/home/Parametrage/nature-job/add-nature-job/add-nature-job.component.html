<div class="container">
  <form (ngSubmit)="onSubmit()" #prioriteForm="ngForm">

    <div class="mb-3">
      <label for="id_natureJob" class="form-label">ID Nature Job</label>
      <input type="text" class="form-control" id="id_natureJob" name="id_natureJob" [(ngModel)]="naturejob.id_natureJob">
    </div>

    <div class="mb-3">
      <label for="libelle" class="form-label">Libellé</label>
      <input type="text" class="form-control" id="libelle" name="libelle" [(ngModel)]="naturejob.libelle" required>
    </div>

    <div class="d-flex justify-content-end">
      <button type="submit" class="btn btn-primary" [disabled]="!prioriteForm.valid">
        {{ initialnaturejob ? 'Modifier' : 'Ajouter' }}
      </button>
      <button type="button" class="btn btn-secondary ms-2" (click)="onCancel()">Annuler</button>
    </div>
    
  </form>
</div>
