<div class="container">
    <form (ngSubmit)="onSubmit()" #prioriteForm="ngForm">
  
      <div class="mb-3">
        <label for="id_grp" class="form-label">ID Groupe Ressource</label>
        <input type="text" class="form-control" id="id_grp" name="id_grp" [(ngModel)]="grouperessource.id_grp">
      </div>
  
      <div class="mb-3">
        <label for="libelle" class="form-label">Libellé</label>
        <input type="text" class="form-control" id="libelle" name="libelle" [(ngModel)]="grouperessource.libelle" required>
      </div>
  
      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-primary" [disabled]="!prioriteForm.valid">
          {{ initialgrouperessource? 'Modifier' : 'Ajouter' }}
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="onCancel()">Annuler</button>
      </div>
      
    </form>
  </div>
