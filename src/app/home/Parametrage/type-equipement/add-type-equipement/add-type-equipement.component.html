<div class="container">
    <form (ngSubmit)="onSubmit()" #typeEquipementForm="ngForm">
  
      <div class="mb-3">
        <label for="id_typeequipement" class="form-label">ID Type Equipement</label>
        <input type="text" class="form-control" id="id_typeequipement" name="id_typeequipement" [(ngModel)]="typeEquipement.id_typeequipement">
      </div>
  
      <div class="mb-3">
        <label for="libelle" class="form-label">Libellé</label>
        <input type="text" class="form-control" id="libelle" name="libelle" [(ngModel)]="typeEquipement.libelle" required>
      </div>
  
      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-primary" [disabled]="!typeEquipementForm.valid">
          {{ initialTypeEquipement ? 'Modifier' : 'Ajouter' }}
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="onCancel()">Annuler</button>
      </div>
      
    </form>
</div>
