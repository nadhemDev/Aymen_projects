<div class="container">
    <form (ngSubmit)="onSubmit()" #prioriteForm="ngForm">
  
      <div class="mb-3">
        <label for="id_natureRel" class="form-label">ID Nature Relation</label>
        <input type="text" class="form-control" id="id_natureRel" name="id_natureRel" [(ngModel)]="naturerelation.id_natureRel">
      </div>
  
      <div class="mb-3">
        <label for="libelle" class="form-label">Libellé</label>
        <input type="text" class="form-control" id="libelle" name="libelle" [(ngModel)]="naturerelation.libelle" required>
      </div>
  
      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-primary" [disabled]="!prioriteForm.valid">
          {{ initialnaturerelation ? 'Modifier' : 'Ajouter' }}
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="onCancel()">Annuler</button>
      </div>
      
    </form>
  </div>
