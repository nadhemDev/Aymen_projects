<div class="container">
    <form (ngSubmit)="onSubmit()" #prioriteForm="ngForm">
  
      <div class="mb-3">
        <label for="libelle" class="form-label">Libelle </label>
        <input type="text" class="form-control" id="libelle" name="libelle" [(ngModel)]="typeprojet.libelle">
      </div>
  
      <div class="mb-3">
        <label for="description" class="form-label">description</label>
        <input type="text" class="form-control" id="description" name="description" [(ngModel)]="typeprojet.description" required>
      </div>
  
      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-primary" [disabled]="!prioriteForm.valid"
        >
          {{ initialtypeprojet ? 'Modifier' : 'Ajouter' }}
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="onCancel()">Annuler</button>
      </div>
      
    </form>
  </div>
