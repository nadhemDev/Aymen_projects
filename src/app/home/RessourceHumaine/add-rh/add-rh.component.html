<form [formGroup]="resourceForm" (ngSubmit)="onSubmit()" novalidate>
  <!-- Success Message -->
  <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="feather icon-check-circle me-2"></i>
    {{ successMessage }}
    <button type="button" class="btn-close" (click)="successMessage = ''"></button>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="feather icon-alert-circle me-2"></i>
    {{ errorMessage }}
    <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
  </div>

  <div class="row">
    <!-- Left Column -->
    <div class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Nom <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="nom" 
               [ngClass]="{'is-invalid': isFieldInvalid('nom')}">
        <div *ngIf="isFieldInvalid('nom')" class="invalid-feedback">
          <span *ngIf="resourceForm.get('nom')?.errors?.required">Le nom est requis</span>
          <span *ngIf="resourceForm.get('nom')?.errors?.minlength">Le nom doit avoir au moins 2 caractères</span>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email <span class="text-danger">*</span></label>
        <input type="email" class="form-control" formControlName="email" 
               [ngClass]="{'is-invalid': isFieldInvalid('email')}">
        <div *ngIf="isFieldInvalid('email')" class="invalid-feedback">
          <span *ngIf="resourceForm.get('email')?.errors?.required">L'email est requis</span>
          <span *ngIf="resourceForm.get('email')?.errors?.email">Email invalide</span>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Téléphone (GSM) <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="gsm" 
               [ngClass]="{'is-invalid': isFieldInvalid('gsm')}">
        <div *ngIf="isFieldInvalid('gsm')" class="invalid-feedback">
          Le téléphone est requis
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Matricule</label>
        <input type="text" class="form-control" formControlName="matricule">
      </div>

      <div class="mb-3">
        <label class="form-label">Contrat</label>
        <input type="text" class="form-control" formControlName="contrat">
      </div>

      <div class="mb-3">
        <label class="form-label">Activité</label>
        <input type="text" class="form-control" formControlName="activite">
      </div>

      <div class="mb-3">
        <label class="form-label">Ressource</label>
        <input type="text" class="form-control" formControlName="ressource">
      </div>

      <div class="mb-3">
        <label class="form-label">Lieu de travail</label>
        <input type="text" class="form-control" formControlName="lieuxTravail">
      </div>

      <div class="mb-3">
  <label class="form-label">Date début <span class="text-danger">*</span></label>
  <input type="date" class="form-control" formControlName="datedebut" 
         [ngClass]="{'is-invalid': isFieldInvalid('datedebut')}">
  <div *ngIf="isFieldInvalid('datedebut')" class="invalid-feedback">
    La date de début est requise
  </div>
</div>

      <div class="mb-3">
        <label class="form-label">Date fin</label>
        <input type="date" class="form-control" formControlName="datefin">
      </div>
    </div>

    <!-- Right Column -->
    <div class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Durée</label>
        <input type="text" class="form-control" formControlName="duree">
      </div>

      <div class="mb-3">
        <label class="form-label">Commercial</label>
        <input type="text" class="form-control" formControlName="commercial">
      </div>

      <div class="mb-3">
        <label class="form-label">Nouvelle mission</label>
        <input type="text" class="form-control" formControlName="nouvellmission">
      </div>

      <div class="mb-3">
        <label class="form-label">Secteur d'activité</label>
        <input type="text" class="form-control" formControlName="secteuractrivite">
      </div>

      <div class="mb-3">
        <label class="form-label">Ferme optionnel</label>
        <input type="text" class="form-control" formControlName="fermeoptionnel">
      </div>

      <div class="mb-3">
        <label class="form-label">Localisation</label>
        <input type="text" class="form-control" formControlName="localisation">
      </div>

      <div class="mb-3">
        <label class="form-label">Télétravail</label>
        <input type="text" class="form-control" formControlName="teletravail">
      </div>

      <div class="mb-3">
        <label class="form-label">Zone A</label>
        <input type="text" class="form-control" formControlName="zoneA">
      </div>

      <div class="mb-3">
        <label class="form-label">Zone B</label>
        <input type="text" class="form-control" formControlName="zoneB">
      </div>

      <div class="mb-3">
        <label class="form-label">Zone C</label>
        <input type="text" class="form-control" formControlName="zoneC">
      </div>

      <div class="mb-3">
        <label class="form-label">Groupe ID</label>
        <input type="number" class="form-control" formControlName="id_grp">
      </div>

      <div class="mb-3">
        <label class="form-label">Commentaire</label>
        <textarea class="form-control" formControlName="commentaire" rows="2"></textarea>
      </div>
    </div>
  </div>

  <div class="modal-footer mt-3">
    <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isSubmitting">
      Annuler
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting || resourceForm.invalid">
      <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1"></span>
      {{ initialRessource ? 'Modifier' : 'Ajouter' }}
    </button>
  </div>
</form>
